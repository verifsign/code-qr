<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification de document</title>
<style>
  :root{ --navy:#1E3A5F; --navy2:#183858; --ok:#2BA66F; --ink:#22303f; --muted:#5C7088; --line:#e4eaf0; --bg:#f4f7fb; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; padding:16px; }
  .card{ max-width:640px; margin:0 auto; background:#fff; border:1px solid var(--line);
         border-radius:16px; overflow:hidden; box-shadow:0 6px 24px rgba(30,58,95,.08); }
  .head{ background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; padding:22px 20px; }
  .head h1{ margin:0; font-size:19px; }
  .head p{ margin:6px 0 0; font-size:12.5px; opacity:.85; }
  .status{ display:inline-flex; align-items:center; gap:7px; margin-top:14px;
           background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3);
           padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:600; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--ok); }
  .body{ padding:18px 20px 22px; }
  .kv{ display:grid; grid-template-columns:130px 1fr; gap:4px 12px; font-size:13.5px; margin-bottom:4px; }
  .kv .k{ color:var(--muted); }
  .kv .v{ font-weight:600; word-break:break-word; }
  h2{ font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--navy);
      margin:22px 0 10px; padding-bottom:7px; border-bottom:2px solid var(--line); }
  .sig{ border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-bottom:10px; }
  .sig .top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .sig .name{ font-weight:700; font-size:15px; }
  .sig .role{ color:var(--muted); font-size:12.5px; margin-top:1px; }
  .sig .when{ font-size:12.5px; margin-top:6px; }
  .sig .when b{ color:var(--navy); }
  .sig .meta{ font-size:12px; color:var(--muted); margin-top:4px; word-break:break-all; }
  .chip{ background:rgba(43,166,111,.12); color:#1c7d52; border:1px solid rgba(43,166,111,.35);
         font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:999px; white-space:nowrap; }
  .mono{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted); word-break:break-all; }
  .note{ font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .foot{ margin-top:18px; padding-top:14px; border-top:1px solid var(--line);
         font-size:11.5px; color:var(--muted); line-height:1.55; }
  .brand{ font-weight:700; color:var(--navy); }
  .err{ text-align:center; color:var(--muted); padding:26px 10px; font-size:14px; }
  .spinner{ width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--navy);
            border-radius:50%; margin:20px auto; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media(max-width:420px){ .kv{ grid-template-columns:1fr; gap:1px; } .kv .k{ margin-top:8px; } }
</style>
</head>
<body>
<div class="card" id="card"><div class="spinner"></div><div class="err">Chargement…</div></div>
<script src="lib/verification.js"></script>
<script>
(function(){
  var card = document.getElementById('card');

  function showError(msg){
    card.innerHTML = '<div class="err">' + msg + '</div>';
  }

  function render(data){
    if(!data){
      showError('Aucune donnée à afficher.<br>Cette page s\'ouvre en scannant le QR code d\'un document.');
      return;
    }

    var sigs = (data.sigs || []).map(function(s){
      var extra = [];
      if(s.e) extra.push(Verification.esc(s.e));
      if(s.ip) extra.push('IP ' + Verification.esc(s.ip));
      return '<div class="sig"><div class="top"><div>'
        + '<div class="name">' + Verification.esc(s.n) + '</div>'
        + '<div class="role">' + Verification.esc(s.r || '') + '</div></div>'
        + '<span class="chip">✓ Signé</span></div>'
        + '<div class="when">Signé le <b>' + Verification.esc(s.d || '') + '</b></div>'
        + (extra.length ? '<div class="meta">' + extra.join(' · ') + '</div>' : '')
        + '</div>';
    }).join('');

    var html = ''
      + '<div class="head">'
      +   '<h1>Vérification de document</h1>'
      +   '<p>Informations enregistrées lors de la signature</p>'
      +   (data.statut ? '<div class="status"><span class="dot"></span> Statut : ' + Verification.esc(data.statut) + '</div>' : '')
      + '</div>'
      + '<div class="body">'
      +   '<div class="kv"><div class="k">Identifiant</div><div class="v">' + Verification.esc(data.id || '—') + '</div></div>'
      +   (data.org ? '<div class="kv"><div class="k">Émis par</div><div class="v">' + Verification.esc(data.org) + '</div></div>' : '')
      +   (data.doc ? '<div class="kv"><div class="k">Document</div><div class="v">' + Verification.esc(data.doc) + '</div></div>' : '')
      +   (data.beneficiaire ? '<div class="kv"><div class="k">Bénéficiaire</div><div class="v">' + Verification.esc(data.beneficiaire) + '</div></div>' : '')
      +   (data.creeLe ? '<div class="kv"><div class="k">Créé le</div><div class="v">' + Verification.esc(data.creeLe) + '</div></div>' : '')
      +   (data.scelleLe ? '<div class="kv"><div class="k">Scellé le</div><div class="v">' + Verification.esc(data.scelleLe) + '</div></div>' : '')
      +   '<h2>Signataires</h2>'
      +   (sigs || '<div class="err">Aucun signataire.</div>')
      +   (data.sha
          ? '<h2>Empreinte SHA-256 du document</h2><div class="mono">' + Verification.esc(data.sha) + '</div>'
            + '<div class="note">Pour vérifier l\'intégrité : calculez le SHA-256 du fichier PDF et comparez-le à cette empreinte.</div>'
          : '')
      +   '<div class="foot">'
      +     'Cette page présente les informations enregistrées'
      +     (data.org ? ' par <span class="brand">' + Verification.esc(data.org) + '</span>' : '')
      +     ' au moment de la signature du document. '
      +     'Elle ne constitue pas une signature électronique qualifiée au sens du règlement (UE) n°910/2014 (eIDAS).'
      +   '</div>'
      + '</div>';

    card.innerHTML = html;
    document.title = 'Vérification — ' + (data.id || 'document');
  }

  function loadFromHash(){
    var raw = (location.hash || '').replace(/^#/, '');
    if(raw.indexOf('d=') === 0) raw = raw.slice(2);
    if(!raw) return null;
    try{
      return Verification.normalizePayload(Verification.decodePayload(raw));
    }catch(e){
      return null;
    }
  }

  function getApiBase(){
    var params = new URLSearchParams(location.search);
    var fromQuery = params.get('api');
    if(fromQuery) return fromQuery.replace(/\/?$/, '');
    if(window.VERIF_API_BASE) return String(window.VERIF_API_BASE).replace(/\/?$/, '');
    return null;
  }

  function loadFromId(id){
    var apiBase = getApiBase();
    var url = apiBase
      ? apiBase + '/api/signature/enveloppe/' + encodeURIComponent(id)
      : 'data/envelopes/' + encodeURIComponent(id) + '.json';
    return fetch(url)
      .then(function(res){
        if(!res.ok) throw new Error('not_found');
        return res.json();
      });
  }

  var hashData = loadFromHash();
  if(hashData){
    render(Verification.normalizePayload(hashData));
    return;
  }

  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  if(!id){
    showError('Aucune donnée à afficher.<br>Cette page s\'ouvre en scannant le QR code d\'un document.');
    return;
  }

  loadFromId(id)
    .then(function(d){ render(Verification.normalizePayload(d)); })
    .catch(function(){
      showError('Document introuvable.<br>L\'identifiant <b>' + Verification.esc(id) + '</b> n\'existe pas ou n\'est plus disponible.');
    });
})();
</script>
</body>
</html>
