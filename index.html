<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Stagiaires — DATA FORMA</title>
<style>
:root{
  --navy:#1E3A5F; --navy2:#183858; --accent:#2563eb; --ok:#2BA66F;
  --ink:#22303f; --muted:#5C7088; --line:#e4eaf0; --bg:#f4f7fb;
  --red:#dc2626; --orange:#d97706;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
}

/* ── LAYOUT ── */
.sidebar{
  position:fixed; top:0; left:0; bottom:0; width:230px;
  background:linear-gradient(180deg,var(--navy),var(--navy2));
  color:#fff; display:flex; flex-direction:column; z-index:100;
}
.sidebar-logo{
  padding:22px 18px 18px;
  border-bottom:1px solid rgba(255,255,255,.12);
}
.sidebar-logo .brand{ font-size:18px; font-weight:800; letter-spacing:.3px; }
.sidebar-logo .sub{ font-size:11.5px; opacity:.6; margin-top:3px; }
.sidebar-nav{ padding:14px 10px; flex:1; }
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:10px; cursor:pointer;
  font-size:13.5px; font-weight:500; margin-bottom:2px;
  transition:background .15s; color:rgba(255,255,255,.75);
}
.nav-item:hover{ background:rgba(255,255,255,.1); color:#fff; }
.nav-item.active{ background:rgba(255,255,255,.18); color:#fff; font-weight:700; }
.nav-item .icon{ font-size:16px; width:20px; text-align:center; }
.sidebar-foot{
  padding:14px 18px 20px;
  border-top:1px solid rgba(255,255,255,.1);
  font-size:11.5px; opacity:.55; line-height:1.6;
}

.main{ margin-left:230px; min-height:100vh; }
.topbar{
  background:#fff; border-bottom:1px solid var(--line);
  padding:14px 28px; display:flex; align-items:center;
  justify-content:space-between; position:sticky; top:0; z-index:50;
}
.topbar h1{ font-size:17px; font-weight:700; color:var(--navy); }
.topbar .right{ display:flex; gap:10px; align-items:center; }
.content{ padding:24px 28px; }

/* ── CARDS / STATS ── */
.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px; }
.stat-card{
  background:#fff; border:1px solid var(--line); border-radius:12px;
  padding:16px 18px;
}
.stat-card .num{ font-size:28px; font-weight:800; color:var(--navy); }
.stat-card .lbl{ font-size:12px; color:var(--muted); margin-top:2px; }

/* ── TABLE ── */
.table-wrap{
  background:#fff; border:1px solid var(--line);
  border-radius:14px; overflow:hidden;
}
.table-head{
  padding:14px 18px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.table-head h2{ font-size:14.5px; font-weight:700; color:var(--navy); }
.search-wrap{ position:relative; }
.search-wrap input{
  padding:7px 12px 7px 32px; border:1px solid var(--line);
  border-radius:8px; font-size:13px; outline:none; width:220px;
  background:#f8fafc; color:var(--ink);
}
.search-wrap input:focus{ border-color:var(--accent); background:#fff; }
.search-icon{
  position:absolute; left:10px; top:50%; transform:translateY(-50%);
  color:var(--muted); font-size:13px; pointer-events:none;
}
table{ width:100%; border-collapse:collapse; font-size:13.5px; }
th{
  text-align:left; padding:10px 16px; font-size:11.5px;
  text-transform:uppercase; letter-spacing:.5px; color:var(--muted);
  background:#f8fafc; border-bottom:1px solid var(--line); font-weight:600;
}
td{ padding:11px 16px; border-bottom:1px solid var(--line); vertical-align:middle; }
tr:last-child td{ border-bottom:none; }
tr:hover td{ background:#f9fbfd; }
.name-cell .main-name{ font-weight:700; }
.name-cell .email{ font-size:11.5px; color:var(--muted); margin-top:1px; }
.pill{
  display:inline-block; padding:3px 9px; border-radius:999px;
  font-size:11.5px; font-weight:600;
}
.pill-ok{ background:rgba(43,166,111,.1); color:#15733d; border:1px solid rgba(43,166,111,.3); }
.pill-pending{ background:rgba(217,119,6,.1); color:#92400e; border:1px solid rgba(217,119,6,.3); }
.pill-new{ background:rgba(37,99,235,.1); color:#1d4ed8; border:1px solid rgba(37,99,235,.3); }
.action-btns{ display:flex; gap:6px; }

/* ── BUTTONS ── */
.btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 14px; border-radius:9px; font-size:13px;
  font-weight:600; cursor:pointer; border:none; transition:opacity .15s;
}
.btn:hover{ opacity:.85; }
.btn-primary{ background:var(--navy); color:#fff; }
.btn-accent{ background:var(--accent); color:#fff; }
.btn-sm{ padding:5px 10px; font-size:12px; border-radius:7px; }
.btn-ghost{
  background:transparent; color:var(--navy);
  border:1px solid var(--line);
}
.btn-danger{ background:var(--red); color:#fff; }
.btn-ok{ background:var(--ok); color:#fff; }

/* ── MODAL ── */
.overlay{
  display:none; position:fixed; inset:0;
  background:rgba(10,20,40,.45); z-index:200;
  align-items:center; justify-content:center; padding:16px;
}
.overlay.open{ display:flex; }
.modal{
  background:#fff; border-radius:16px; width:100%; max-width:560px;
  max-height:90vh; overflow-y:auto;
  box-shadow:0 20px 60px rgba(10,20,40,.25);
}
.modal-head{
  padding:18px 22px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
}
.modal-head h3{ font-size:16px; font-weight:700; color:var(--navy); }
.close-btn{
  background:none; border:none; font-size:20px; cursor:pointer;
  color:var(--muted); line-height:1; padding:2px 6px; border-radius:6px;
}
.close-btn:hover{ background:var(--line); }
.modal-body{ padding:20px 22px; }
.modal-foot{
  padding:14px 22px; border-top:1px solid var(--line);
  display:flex; justify-content:flex-end; gap:10px;
}

/* ── FORM ── */
.form-group{ margin-bottom:14px; }
.form-group label{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:5px; }
.form-group input,
.form-group select,
.form-group textarea{
  width:100%; padding:9px 12px; border:1px solid var(--line);
  border-radius:9px; font-size:13.5px; color:var(--ink); outline:none;
  background:#fafcff; transition:border-color .15s;
  font-family:inherit;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{ border-color:var(--accent); background:#fff; }
.form-group textarea{ resize:vertical; min-height:60px; }
.form-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-sep{
  font-size:11.5px; text-transform:uppercase; letter-spacing:.6px;
  color:var(--navy); margin:18px 0 10px; padding-bottom:7px;
  border-bottom:2px solid var(--line); font-weight:700;
}
.sig-block{
  border:1px solid var(--line); border-radius:10px;
  padding:12px 14px; margin-bottom:10px; background:#f9fbfd;
}
.sig-block-head{
  display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
}
.sig-block-head span{ font-size:12.5px; font-weight:700; color:var(--navy); }

/* ── QR PANEL ── */
.qr-panel{ text-align:center; padding:10px 0 6px; }
.qr-panel canvas,
.qr-panel img{ border:1px solid var(--line); border-radius:10px; }
.qr-url{
  font-size:11px; color:var(--muted); margin-top:8px;
  word-break:break-all; max-width:100%; line-height:1.5;
}
.qr-actions{ display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap; }

/* ── EMPTY ── */
.empty{
  text-align:center; padding:48px 20px; color:var(--muted);
}
.empty .icon{ font-size:40px; margin-bottom:14px; }
.empty p{ font-size:14px; }

/* ── MOBILE ── */
@media(max-width:700px){
  .sidebar{ display:none; }
  .main{ margin-left:0; }
  .content{ padding:16px; }
  .topbar{ padding:12px 16px; }
  .form-row{ grid-template-columns:1fr; }
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sidebar-logo">
    <div class="brand">🎓 DATA FORMA</div>
    <div class="sub">CRM Stagiaires</div>
  </div>
  <div class="sidebar-nav">
    <div class="nav-item active" onclick="showView('list')"><span class="icon">👥</span> Stagiaires</div>
    <div class="nav-item" onclick="showView('add')"><span class="icon">➕</span> Ajouter</div>
    <div class="nav-item" onclick="showView('about')"><span class="icon">ℹ️</span> À propos</div>
  </div>
  <div class="sidebar-foot">
    DATA FORMA<br>33 av. Philippe-Auguste<br>75011 Paris<br>SIRET 91509992300012
  </div>
</nav>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <h1 id="page-title">Stagiaires</h1>
    <div class="right">
      <button class="btn btn-primary" onclick="showView('add')">+ Nouveau stagiaire</button>
    </div>
  </div>
  <div class="content" id="content"><!-- rendered by JS --></div>
</div>

<!-- MODAL QR -->
<div class="overlay" id="qr-overlay" onclick="closeQr(event)">
  <div class="modal" id="qr-modal">
    <div class="modal-head">
      <h3 id="qr-modal-title">QR Code</h3>
      <button class="close-btn" onclick="closeQrBtn()">✕</button>
    </div>
    <div class="modal-body">
      <div class="qr-panel" id="qr-panel"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" onclick="closeQrBtn()">Fermer</button>
      <button class="btn btn-ok btn-sm" onclick="downloadQr()">⬇ Télécharger</button>
      <button class="btn btn-accent btn-sm" onclick="copyQrUrl()">🔗 Copier l'URL</button>
    </div>
  </div>
</div>

<!-- qrcode.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ══════════════════════════════════════════════
   CONFIG — MODIFIER ICI
   ══════════════════════════════════════════════ */
var ORG = "DATA FORMA";
var OUTIL = "LMS DATA FORMA";
var NDA  = ""; // numéro de déclaration activité (optionnel)

/* URL de la page de vérification hébergée sur GitHub Pages.
   Format : https://<user>.github.io/<repo>/verify/
   Mets à jour ci-dessous dès que GitHub Pages est activé. */
var VERIF_BASE = (function(){
  var h = location.hostname;
  if(h === 'localhost' || h === '127.0.0.1'){
    return location.origin + location.pathname.replace(/\/[^\/]*$/,'/') + 'verify/';
  }
  /* GitHub Pages : https://verifsign.github.io/code-qr/verify/ */
  return 'https://verifsign.github.io/code-qr/verify/';
})();

/* ══════════════════════════════════════════════
   STOCKAGE (localStorage)
   ══════════════════════════════════════════════ */
var STORE_KEY = 'dataforma_crm_v1';

function loadData(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); }catch(e){ return []; }
}
function saveData(arr){ localStorage.setItem(STORE_KEY, JSON.stringify(arr)); }
function genId(){
  return Array.from({length:13},function(){return Math.random().toString(36)[2].toUpperCase();}).join('');
}

/* ══════════════════════════════════════════════
   VIEWS
   ══════════════════════════════════════════════ */
var currentView='list';
var editId=null;

function showView(v){
  currentView=v; editId=null;
  document.querySelectorAll('.nav-item').forEach(function(el){
    el.classList.toggle('active', el.textContent.trim().indexOf(
      v==='list'?'Stagiaires':v==='add'?'Ajouter':'À propos'
    )!==-1);
  });
  renderContent();
}

function renderContent(){
  var c=document.getElementById('content');
  var t=document.getElementById('page-title');
  if(currentView==='list'){ t.textContent='Stagiaires'; c.innerHTML=renderList(); }
  else if(currentView==='add'){ t.textContent='Nouveau stagiaire'; c.innerHTML=renderForm(null); bindForm(); }
  else if(currentView==='edit'){ t.textContent='Modifier le stagiaire'; c.innerHTML=renderForm(editId); bindForm(); }
  else if(currentView==='about'){ t.textContent='À propos'; c.innerHTML=renderAbout(); }
}

/* ══════════════════════════════════════════════
   LIST VIEW
   ══════════════════════════════════════════════ */
function renderList(){
  var data=loadData();
  var ok=data.filter(function(d){return d.statut==='Terminé';}).length;
  var enc=data.filter(function(d){return d.statut==='En cours';}).length;
  var html='<div class="stats">'
    +'<div class="stat-card"><div class="num">'+data.length+'</div><div class="lbl">Stagiaires total</div></div>'
    +'<div class="stat-card"><div class="num">'+ok+'</div><div class="lbl">Documents terminés</div></div>'
    +'<div class="stat-card"><div class="num">'+enc+'</div><div class="lbl">En cours</div></div>'
    +'</div>';

  html+='<div class="table-wrap">'
    +'<div class="table-head">'
    +'<h2>Liste des stagiaires</h2>'
    +'<div class="search-wrap">'
    +'<span class="search-icon">🔍</span>'
    +'<input type="text" id="search" placeholder="Rechercher…" oninput="filterTable()" />'
    +'</div>'
    +'</div>'
    +'<div style="overflow-x:auto">'
    +'<table id="main-table">'
    +'<thead><tr>'
    +'<th>Stagiaire</th><th>Formation</th><th>Document</th><th>Statut</th><th>Créé le</th><th>Actions</th>'
    +'</tr></thead>'
    +'<tbody id="table-body">'
    +renderRows(data)
    +'</tbody>'
    +'</table>'
    +(data.length===0?'<div class="empty"><div class="icon">👥</div><p>Aucun stagiaire. Cliquez sur "+ Nouveau stagiaire".</p></div>':'')
    +'</div>'
    +'</div>';
  return html;
}

function renderRows(data){
  if(!data.length) return '';
  return data.map(function(d){
    var pill=d.statut==='Terminé'?'pill-ok':d.statut==='En cours'?'pill-pending':'pill-new';
    return '<tr data-id="'+d.id+'" data-search="'+(d.nom+' '+d.email+' '+d.doc+' '+d.form).toLowerCase()+'">'
      +'<td><div class="name-cell"><div class="main-name">'+esc(d.nom)+'</div><div class="email">'+esc(d.email||'')+'</div></div></td>'
      +'<td>'+esc(d.form||'—')+'</td>'
      +'<td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(d.doc||'—')+'</td>'
      +'<td><span class="pill '+pill+'">'+esc(d.statut||'—')+'</span></td>'
      +'<td>'+esc(d.dcr||'—')+'</td>'
      +'<td><div class="action-btns">'
      +'<button class="btn btn-sm btn-ok" onclick="showQr(\''+d.id+'\')">QR</button>'
      +'<button class="btn btn-sm btn-ghost" onclick="editStagiaire(\''+d.id+'\')">✏️</button>'
      +'<button class="btn btn-sm btn-danger" onclick="deleteStagiaire(\''+d.id+'\')">🗑</button>'
      +'</div></td>'
      +'</tr>';
  }).join('');
}

function filterTable(){
  var q=document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('#table-body tr').forEach(function(tr){
    tr.style.display=(!q||tr.dataset.search.indexOf(q)!==-1)?'':'none';
  });
}

/* ══════════════════════════════════════════════
   FORM VIEW
   ══════════════════════════════════════════════ */
function renderForm(id){
  var d=null;
  if(id){ var arr=loadData(); d=arr.find(function(x){return x.id===id;})||null; }
  var sigs=d&&d.sigs?d.sigs:[
    {n:ORG,r:'Gérant '+ORG,e:'dataforma.direction@gmail.com',d:'',ip:''},
    {n:'',r:'Stagiaire',e:'',d:'',ip:''}
  ];

  var sigHtml=sigs.map(function(s,i){
    return '<div class="sig-block" id="sig-'+i+'">'
      +'<div class="sig-block-head"><span>Signataire '+(i+1)+'</span>'
      +(i>0?'<button type="button" class="btn btn-danger btn-sm" onclick="removeSig('+i+')">Supprimer</button>':'')
      +'</div>'
      +'<div class="form-row">'
      +'<div class="form-group"><label>Nom *</label><input name="sig_n_'+i+'" value="'+esc(s.n)+'" required></div>'
      +'<div class="form-group"><label>Rôle</label><input name="sig_r_'+i+'" value="'+esc(s.r||'')+'"></div>'
      +'</div>'
      +'<div class="form-row">'
      +'<div class="form-group"><label>Email</label><input name="sig_e_'+i+'" type="email" value="'+esc(s.e||'')+'"></div>'
      +'<div class="form-group"><label>Date &amp; heure signature</label><input name="sig_d_'+i+'" value="'+esc(s.d||'')+'"></div>'
      +'</div>'
      +'<div class="form-group"><label>IP</label><input name="sig_ip_'+i+'" value="'+esc(s.ip||'')+'"></div>'
      +'</div>';
  }).join('');

  return '<form id="stag-form" onsubmit="submitForm(event)">'
    +'<div class="form-sep">Informations du stagiaire</div>'
    +'<div class="form-row">'
    +'<div class="form-group"><label>Nom complet *</label><input name="nom" value="'+esc(d?d.nom:'')+'" required placeholder="Ex. BAPTISTE BLETEAU"></div>'
    +'<div class="form-group"><label>Email</label><input name="email" type="email" value="'+esc(d?d.email||'':'')+'" placeholder="stagiaire@exemple.com"></div>'
    +'</div>'
    +'<div class="form-group"><label>Formation</label><input name="form" value="'+esc(d?d.form||'':'')+'" placeholder="Ex. BTS NDRC"></div>'

    +'<div class="form-sep">Document</div>'
    +'<div class="form-group"><label>Intitulé du document</label><textarea name="doc">'+esc(d?d.doc||'':'')+'</textarea></div>'
    +'<div class="form-row">'
    +'<div class="form-group"><label>Identifiant document</label><input name="docid" value="'+esc(d?d.docid||d.id||'':'')+'" placeholder="Généré auto si vide"></div>'
    +'<div class="form-group"><label>Date de création</label><input name="dcr" value="'+esc(d?d.dcr||'':'')+'" placeholder="Ex. 05/05/2026"></div>'
    +'</div>'
    +'<div class="form-row">'
    +'<div class="form-group"><label>Statut</label>'
    +'<select name="statut">'
    +'<option value="Terminé"'+(d&&d.statut==='Terminé'?' selected':'')+'>Terminé</option>'
    +'<option value="En cours"'+(d&&d.statut==='En cours'?' selected':'')+'>En cours</option>'
    +'<option value="En attente"'+(d&&d.statut==='En attente'?' selected':'')+'>En attente</option>'
    +'</select></div>'
    +'<div class="form-group"><label>Bénéficiaire (si différent du nom)</label><input name="ben" value="'+esc(d?d.ben||'':'')+'" placeholder="Idem nom si vide"></div>'
    +'</div>'
    +'<div class="form-group"><label>Empreinte SHA-256 du document</label>'
    +'<input name="sha" value="'+esc(d?d.sha||'':'')+'" placeholder="Optionnel — collez ici le hash du PDF"></div>'

    +'<div class="form-sep" id="sigs-title">Signataires <button type="button" class="btn btn-ghost btn-sm" style="margin-left:10px" onclick="addSig()">+ Ajouter</button></div>'
    +'<div id="sigs-container">'+sigHtml+'</div>'

    +'<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;">'
    +'<button type="button" class="btn btn-ghost" onclick="showView(\'list\')">Annuler</button>'
    +'<button type="submit" class="btn btn-primary">'+(d?'Enregistrer':'Créer le stagiaire')+'</button>'
    +'</div>'
    +'</form>';
}

var _sigCount=0;
function bindForm(){
  var sigs=document.querySelectorAll('.sig-block');
  _sigCount=sigs.length;
}
function addSig(){
  var c=document.getElementById('sigs-container');
  var i=_sigCount++;
  var div=document.createElement('div');
  div.innerHTML='<div class="sig-block" id="sig-'+i+'">'
    +'<div class="sig-block-head"><span>Signataire '+(i+1)+'</span>'
    +'<button type="button" class="btn btn-danger btn-sm" onclick="removeSig('+i+')">Supprimer</button>'
    +'</div>'
    +'<div class="form-row">'
    +'<div class="form-group"><label>Nom *</label><input name="sig_n_'+i+'" required></div>'
    +'<div class="form-group"><label>Rôle</label><input name="sig_r_'+i+'"></div>'
    +'</div>'
    +'<div class="form-row">'
    +'<div class="form-group"><label>Email</label><input name="sig_e_'+i+'" type="email"></div>'
    +'<div class="form-group"><label>Date &amp; heure signature</label><input name="sig_d_'+i+'"></div>'
    +'</div>'
    +'<div class="form-group"><label>IP</label><input name="sig_ip_'+i+'"></div>'
    +'</div>';
  c.appendChild(div.firstChild);
}
function removeSig(i){
  var el=document.getElementById('sig-'+i);
  if(el) el.remove();
}

function submitForm(e){
  e.preventDefault();
  var f=e.target;
  var arr=loadData();
  var isEdit=!!editId;
  var existing=isEdit?arr.find(function(x){return x.id===editId;}):null;

  var sigs=[];
  var i=0;
  while(true){
    var nEl=f.querySelector('[name="sig_n_'+i+'"]');
    if(!nEl) break;
    var n=nEl.value.trim();
    if(n){
      sigs.push({
        n:n,
        r:(f.querySelector('[name="sig_r_'+i+'"]')||{}).value||'',
        e:(f.querySelector('[name="sig_e_'+i+'"]')||{}).value||'',
        d:(f.querySelector('[name="sig_d_'+i+'"]')||{}).value||'',
        ip:(f.querySelector('[name="sig_ip_'+i+'"]')||{}).value||''
      });
    }
    i++;
  }

  var docid=f.docid.value.trim()||genId();
  var rec={
    id: isEdit?existing.id:genId(),
    docid: docid,
    nom: f.nom.value.trim(),
    email: f.email.value.trim(),
    form: f.form.value.trim(),
    doc: f.doc.value.trim(),
    dcr: f.dcr.value.trim(),
    statut: f.statut.value,
    ben: f.ben.value.trim(),
    sha: f.sha.value.trim(),
    org: ORG,
    outil: OUTIL,
    nda: NDA,
    sigs: sigs,
    updatedAt: new Date().toISOString()
  };

  if(isEdit){
    arr=arr.map(function(x){return x.id===editId?rec:x;});
  } else {
    arr.push(rec);
  }
  saveData(arr);
  showView('list');
}

function editStagiaire(id){
  editId=id; currentView='edit';
  document.getElementById('page-title').textContent='Modifier le stagiaire';
  document.getElementById('content').innerHTML=renderForm(id);
  bindForm();
}

function deleteStagiaire(id){
  if(!confirm('Supprimer ce stagiaire ?')) return;
  var arr=loadData().filter(function(x){return x.id!==id;});
  saveData(arr);
  renderContent();
}

/* ══════════════════════════════════════════════
   QR CODE
   ══════════════════════════════════════════════ */
var _currentQrUrl='';

function toB64Url(obj){
  return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}

function buildVerifUrl(d){
  var payload={
    id:  d.docid||d.id,
    org: d.org||ORG,
    doc: d.doc||undefined,
    ben: d.ben||d.nom||undefined,
    form:d.form||undefined,
    dcr: d.dcr||undefined,
    statut: d.statut||undefined,
    outil: d.outil||OUTIL,
    sha: d.sha||undefined,
    nda: d.nda||NDA||undefined,
    sigs:(d.sigs||[]).map(function(s){
      return {n:s.n,r:s.r||undefined,e:s.e||undefined,d:s.d||undefined,ip:s.ip||undefined};
    })
  };
  /* supprimer les clés undefined */
  payload=JSON.parse(JSON.stringify(payload));
  return VERIF_BASE+'#d='+toB64Url(payload);
}

function showQr(id){
  var arr=loadData();
  var d=arr.find(function(x){return x.id===id;});
  if(!d) return;

  var url=buildVerifUrl(d);
  _currentQrUrl=url;

  document.getElementById('qr-modal-title').textContent='QR — '+d.nom;

  var panel=document.getElementById('qr-panel');
  panel.innerHTML='<div id="qr-canvas-wrap"></div>'
    +'<div class="qr-url">'+esc(url)+'</div>';

  /* génération QR */
  new QRCode(document.getElementById('qr-canvas-wrap'),{
    text: url,
    width: 220,
    height: 220,
    colorDark: '#1E3A5F',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });

  document.getElementById('qr-overlay').classList.add('open');
}

function closeQr(e){ if(e.target===document.getElementById('qr-overlay')) closeQrBtn(); }
function closeQrBtn(){ document.getElementById('qr-overlay').classList.remove('open'); }

function downloadQr(){
  var wrap=document.getElementById('qr-canvas-wrap');
  var img=wrap.querySelector('img')||wrap.querySelector('canvas');
  if(!img) return;
  var src=img.tagName==='CANVAS'?img.toDataURL():img.src;
  var a=document.createElement('a');
  a.href=src; a.download='qr-dataforma.png'; a.click();
}

function copyQrUrl(){
  navigator.clipboard.writeText(_currentQrUrl).then(function(){
    alert('URL copiée dans le presse-papiers !');
  }).catch(function(){
    prompt('Copiez cette URL :', _currentQrUrl);
  });
}

    +'<input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">'
    +'</div>'

}

function exportData(){
  var blob=new Blob([JSON.stringify(loadData(),null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='dataforma-stagiaires.json'; a.click();
}

function importData(e){
  var file=e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var arr=JSON.parse(ev.target.result);
      if(!Array.isArray(arr)) throw new Error('Format invalide');
      if(confirm('Importer '+arr.length+' stagiaire(s) ? (remplace les données existantes)')){
        saveData(arr); showView('list');
      }
    }catch(err){ alert('Fichier invalide : '+err.message); }
  };
  reader.readAsText(file);
}

/* ══════════════════════════════════════════════
   UTILS
   ══════════════════════════════════════════════ */
function esc(x){
  return String(x==null?'':x)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
