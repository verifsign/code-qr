<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification de signature électronique</title>
<style>
  :root{ --navy:#1E3A5F; --navy2:#183858; --accent:#00B4D8; --ok:#2BA66F; --ink:#22303f; --muted:#5C7088; --line:#e4eaf0; --bg:#f4f7fb; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        -webkit-font-smoothing:antialiased; padding:16px; }
  .card{ max-width:640px; margin:0 auto; background:#fff; border:1px solid var(--line);
         border-radius:16px; overflow:hidden; box-shadow:0 6px 24px rgba(30,58,95,.08); }
  .head{ background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; padding:22px 20px; }
  .head h1{ margin:0; font-size:19px; letter-spacing:.2px; }
  .head p{ margin:6px 0 0; font-size:12.5px; opacity:.85; }
  .valid{ display:inline-flex; align-items:center; gap:7px; margin-top:14px;
           background:rgba(43,166,111,.18); color:#c9f5df; border:1px solid rgba(43,166,111,.5);
           padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:600; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px rgba(43,166,111,.25); }
  .body{ padding:18px 20px 22px; }
  .kv{ display:grid; grid-template-columns:130px 1fr; gap:4px 12px; font-size:13.5px; margin-bottom:4px; }
  .kv .k{ color:var(--muted); }
  .kv .v{ font-weight:600; word-break:break-word; }
  h2{ font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--navy);
      margin:22px 0 10px; padding-bottom:7px; border-bottom:2px solid var(--line); }
  .sig{ border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-bottom:10px; }
  .sig .top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .sig .name{ font-weight:700; font-size:15px; }
  .sig .role{ color:var(--muted); font-size:12.5px; margin-top:1px; }
  .sig .when{ font-size:12.5px; color:var(--ink); margin-top:6px; }
  .sig .when b{ color:var(--navy); }
  .chip{ background:rgba(43,166,111,.12); color:#1c7d52; border:1px solid rgba(43,166,111,.35);
         font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:999px; white-space:nowrap; }
  .mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px;
         color:var(--muted); word-break:break-all; }
  .foot{ margin-top:18px; padding-top:14px; border-top:1px solid var(--line);
         font-size:11.5px; color:var(--muted); line-height:1.55; }
  .brand{ font-weight:700; color:var(--navy); }
  .err{ text-align:center; color:var(--muted); padding:26px 10px; font-size:14px; }
  .spinner{ width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--navy);
            border-radius:50%; margin:20px auto; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media(max-width:420px){ .kv{ grid-template-columns:1fr; gap:1px; } .kv .k{ margin-top:8px; } }
</style>
</head>
<body>
<div class="card" id="card"><div class="spinner"></div><div class="err">Chargement…</div></div>
<script src="lib/verification.js"></script>
<script>
(function(){
  var card = document.getElementById('card');

  function showError(msg){
    card.innerHTML = '<div class="err">' + msg + '</div>';
  }

  function field(data, keys){
    for(var i = 0; i < keys.length; i++){
      if(data[keys[i]]) return data[keys[i]];
    }
    return '';
  }

  function isComplete(data){
    var seal = field(data, ['scelleLe', 'seal']);
    var statut = field(data, ['statut', 'status']);
    return !!(seal || /termin/i.test(statut));
  }

  function render(data){
    if(!data){
      showError('Aucune donnée de signature à afficher.<br>Cette page s\'ouvre en scannant le QR code d\'une attestation.');
      return;
    }

    var id = field(data, ['id', 'env']) || '—';
    var beneficiaire = field(data, ['beneficiaire', 'stag']);
    var doc = field(data, ['doc']);
    var org = field(data, ['org']);
    var seal = field(data, ['scelleLe', 'seal']);
    var sha = field(data, ['sha']);

    var sigs = (data.sigs || []).map(function(s){
      return '<div class="sig"><div class="top"><div>'
        + '<div class="name">' + Verification.esc(s.n) + '</div>'
        + '<div class="role">' + Verification.esc(s.r || '') + '</div></div>'
        + '<span class="chip">✓ Signé</span></div>'
        + '<div class="when">Signé le <b>' + Verification.esc(s.d || '') + '</b></div></div>';
    }).join('');

    var html = ''
      + '<div class="head">'
      +   '<h1>Attestation de signature électronique</h1>'
      +   '<p>Conforme au règlement eIDAS · norme ISO 27001</p>'
      +   (isComplete(data)
          ? '<div class="valid"><span class="dot"></span> Signature vérifiée — Enveloppe terminée</div>'
          : '')
      + '</div>'
      + '<div class="body">'
      +   '<div class="kv"><div class="k">Identifiant</div><div class="v">' + Verification.esc(id) + '</div></div>'
      +   (beneficiaire ? '<div class="kv"><div class="k">Bénéficiaire</div><div class="v">' + Verification.esc(beneficiaire) + '</div></div>' : '')
      +   (doc ? '<div class="kv"><div class="k">Document</div><div class="v">' + Verification.esc(doc) + '</div></div>' : '')
      +   (org ? '<div class="kv"><div class="k">Organisme</div><div class="v">' + Verification.esc(org) + '</div></div>' : '')
      +   '<h2>Signataires</h2>'
      +   (sigs || '<div class="err">Aucun signataire.</div>')
      +   (seal ? '<div class="kv" style="margin-top:14px"><div class="k">Scellé le</div><div class="v">' + Verification.esc(seal) + '</div></div>' : '')
      +   (sha ? '<h2>Empreinte SHA-256</h2><div class="mono">' + Verification.esc(sha) + '</div>' : '')
      +   '<div class="foot">'
      +     'Ce document a été signé électroniquement conformément au règlement (UE) n°910/2014 (eIDAS). '
      +     'L\'intégrité est garantie par l\'empreinte SHA-256.'
      +     (org ? '<br><span class="brand">' + Verification.esc(org) + '</span>' : '')
      +   '</div>'
      + '</div>';

    card.innerHTML = html;
    document.title = 'Vérification — ' + id;
  }

  function loadFromHash(){
    var raw = (location.hash || '').replace(/^#/, '');
    if(raw.indexOf('d=') === 0) raw = raw.slice(2);
    if(!raw) return null;
    try{
      return Verification.normalizePayload(Verification.decodePayload(raw));
    }catch(e){
      return null;
    }
  }

  function getApiBase(){
    var params = new URLSearchParams(location.search);
    var fromQuery = params.get('api');
    if(fromQuery) return fromQuery.replace(/\/?$/, '');
    if(window.VERIF_API_BASE) return String(window.VERIF_API_BASE).replace(/\/?$/, '');
    return null;
  }

  function loadFromId(id){
    var apiBase = getApiBase();
    var url = apiBase
      ? apiBase + '/api/signature/enveloppe/' + encodeURIComponent(id)
      : 'data/envelopes/' + encodeURIComponent(id) + '.json';
    return fetch(url)
      .then(function(res){
        if(!res.ok) throw new Error('not_found');
        return res.json();
      });
  }

  var hashData = loadFromHash();
  if(hashData){
    render(Verification.normalizePayload(hashData));
    return;
  }

  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  if(!id){
    showError('Aucune donnée de signature à afficher.<br>Cette page s\'ouvre en scannant le QR code d\'une attestation.');
    return;
  }

  loadFromId(id)
    .then(function(d){ render(Verification.normalizePayload(d)); })
    .catch(function(){
      showError('Document introuvable.<br>L\'identifiant <b>' + Verification.esc(id) + '</b> n\'existe pas ou n\'est plus disponible.');
    });
})();
</script>
</body>
</html>
