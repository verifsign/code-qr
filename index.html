<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification de document</title>
<style>
  :root{ --navy:#1E3A5F; --navy2:#183858; --ok:#2BA66F; --warn:#c0392b; --ink:#22303f; --muted:#5C7088; --line:#e4eaf0; --bg:#f4f7fb; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; padding:16px; }
  .card{ max-width:640px; margin:0 auto; background:#fff; border:1px solid var(--line);
         border-radius:16px; overflow:hidden; box-shadow:0 6px 24px rgba(30,58,95,.08); }
  .head{ background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; padding:22px 20px; }
  .head h1{ margin:0; font-size:19px; }
  .head p{ margin:6px 0 0; font-size:12.5px; opacity:.85; }
  .status{ display:inline-flex; align-items:center; gap:7px; margin-top:14px;
           background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3);
           padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:600; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--ok); }
  .body{ padding:18px 20px 22px; }
  .kv{ display:grid; grid-template-columns:150px 1fr; gap:4px 12px; font-size:13.5px; margin-bottom:4px; }
  .kv .k{ color:var(--muted); }
  .kv .v{ font-weight:600; word-break:break-word; }
  h2{ font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--navy);
      margin:22px 0 10px; padding-bottom:7px; border-bottom:2px solid var(--line); }
  .sig{ border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-bottom:10px; }
  .sig .top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .sig .name{ font-weight:700; font-size:15px; }
  .sig .role{ color:var(--muted); font-size:12.5px; margin-top:1px; }
  .sig .when{ font-size:12.5px; margin-top:6px; }
  .sig .when b{ color:var(--navy); }
  .sig .meta{ font-size:11.5px; color:var(--muted); margin-top:4px; }
  .chip{ background:rgba(43,166,111,.12); color:#1c7d52; border:1px solid rgba(43,166,111,.35);
         font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:999px; white-space:nowrap; }
  .mono{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted); word-break:break-all; }
  .note{ font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .foot{ margin-top:18px; padding-top:14px; border-top:1px solid var(--line);
         font-size:11.5px; color:var(--muted); line-height:1.55; }
  .brand{ font-weight:700; color:var(--navy); }
  .err{ text-align:center; color:var(--muted); padding:26px 10px; font-size:14px; line-height:1.6; }
  .err.bad{ color:var(--warn); }
  a{ color:var(--navy); }
  @media(max-width:420px){ .kv{ grid-template-columns:1fr; gap:1px; } .kv .k{ margin-top:8px; } }
</style>
</head>
<body>
<div class="card" id="card"><div class="err">Chargement…</div></div>
<script>
(function(){
  "use strict";

  function b64urlDecode(s){
    s = s.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length % 4) s += '=';
    try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return atob(s); }
  }
  function esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var card = document.getElementById('card');

  function showError(msg, bad){
    card.innerHTML = '<div class="err'+(bad?' bad':'')+'">'+msg+'</div>';
  }

  // ---- Rendu de la fiche ----------------------------------------------------
  function render(data){
    if(!data || typeof data !== 'object'){
      showError('Aucune donnée à afficher.<br>Cette page s\'ouvre en scannant le QR code d\'un document.');
      return;
    }

    var sigs = (data.sigs||[]).map(function(s){
      var meta = [];
      if(s.mail) meta.push(esc(s.mail));
      if(s.ip)   meta.push('IP '+esc(s.ip));
      return '<div class="sig"><div class="top"><div>'
        + '<div class="name">'+esc(s.n)+'</div>'
        + '<div class="role">'+esc(s.r||'')+'</div></div>'
        + '<span class="chip">\u2713 Signé</span></div>'
        + (s.d?'<div class="when">Signé le <b>'+esc(s.d)+'</b></div>':'')
        + (meta.length?'<div class="meta">'+meta.join(' \u00b7 ')+'</div>':'')
        + '</div>';
    }).join('');

    var rows = ''
      + '<div class="kv"><div class="k">Identifiant</div><div class="v">'+esc(data.id||'—')+'</div></div>'
      + (data.org?'<div class="kv"><div class="k">Émis par</div><div class="v">'+esc(data.org)+'</div></div>':'')
      + (data.doc?'<div class="kv"><div class="k">Document</div><div class="v">'+esc(data.doc)+'</div></div>':'')
      + (data.beneficiaire?'<div class="kv"><div class="k">Bénéficiaire</div><div class="v">'+esc(data.beneficiaire)+'</div></div>':'')
      + (data.formation?'<div class="kv"><div class="k">Formation</div><div class="v">'+esc(data.formation)+'</div></div>':'')
      + (data.date?'<div class="kv"><div class="k">Date de création</div><div class="v">'+esc(data.date)+'</div></div>':'');

    var html = ''
      + '<div class="head">'
      +   '<h1>Vérification de document</h1>'
      +   '<p>Informations enregistrées lors de la signature</p>'
      +   (data.statut?'<div class="status"><span class="dot"></span> Statut : '+esc(data.statut)+'</div>':'')
      + '</div>'
      + '<div class="body">'
      +   rows
      +   '<h2>Signataires</h2>'
      +   (sigs || '<div class="err">Aucun signataire.</div>')
      +   (data.sha
          ? '<h2>Empreinte SHA-256 des données signées</h2><div class="mono">'+esc(data.sha)+'</div>'
            + '<div class="note">Empreinte enregistrée au moment de la signature. Pour vérifier l\'intégrité, comparez-la à l\'empreinte du fichier de référence.</div>'
          : '')
      +   '<div class="foot">'
      +     'Cette page présente les informations enregistrées'
      +     (data.org?' par <span class="brand">'+esc(data.org)+'</span>':'')
      +     ' au moment de la signature du document. '
      +     'Elle ne constitue pas une signature électronique qualifiée au sens du règlement (UE) n°910/2014 (eIDAS).'
      +   '</div>'
      + '</div>';

    card.innerHTML = html;
    document.title = 'Vérification — ' + (data.id||'document');
  }

  // ---- Lecture des paramètres ----------------------------------------------
  // Mode 1 (embarqué)   : #d=<base64url(JSON)>  — tout est dans le QR
  // Mode 2 (CRM par ID) : ?id=XXXX              — recherche dans data/registre.json
  var hash = (location.hash || '').replace(/^#/,'');
  if(hash.indexOf('d=')===0) hash = hash.slice(2);

  var params = new URLSearchParams(location.search);
  var id = params.get('id');

  // Mode embarqué : les données sont dans le fragment d'URL
  if(hash){
    var data = null;
    try{ data = JSON.parse(b64urlDecode(hash)); }catch(e){ data = null; }
    if(!data){
      showError('Le contenu du QR code est illisible ou incomplet.', true);
      return;
    }
    render(data);
    return;
  }

  // Mode CRM : on récupère le registre exporté depuis le CRM
  if(id){
    fetch('data/registre.json', {cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('registre indisponible');
        return r.json();
      })
      .then(function(reg){
        // Le registre peut être un objet { "ID": {...} } ou un tableau [{id:...}]
        var entry = null;
        if(Array.isArray(reg)){
          entry = reg.filter(function(e){ return String(e.id) === String(id); })[0];
        } else if(reg && typeof reg === 'object'){
          entry = reg[id];
        }
        if(!entry){
          showError('Aucun document ne correspond à l\'identifiant <b>'+esc(id)+'</b>.<br>'
            + 'Il est possible que ce document ait été retiré ou que l\'identifiant soit erroné.', true);
          return;
        }
        if(!entry.id) entry.id = id;
        render(entry);
      })
      .catch(function(){
        showError('Impossible de contacter le registre de vérification pour le moment.<br>Réessayez plus tard.', true);
      });
    return;
  }

  showError('Aucune donnée à afficher.<br>Cette page s\'ouvre en scannant le QR code d\'un document.');
})();
</script>
</body>
</html>
